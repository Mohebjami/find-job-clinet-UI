name: find-job

services:
  frontend:
    build:
      context: .
      args:
        BACKEND_URL: ${BACKEND_URL:-http://app:8000}
    image: find-job:local
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  backend:
    external: true
    name: ${BACKEND_NETWORK:-my-project_default}
